baseURL = 'https://jeonck.github.io/coding-journal/'
locale = 'ko-kr'
title = 'Coding Journal'
theme = 'PaperMod'
paginate = 10

[params]
  env = 'production'
  title = 'Coding Journal'
  description = '코딩을 익히기 위해 예시와 함께 배워나가는 개발 학습 블로그'
  author = 'jeonck'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = '안녕하세요 👋'
    Content = '코딩을 익히기 위해 예시와 함께 배워나가는 개발 학습 블로그입니다.'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/jeonck'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']
